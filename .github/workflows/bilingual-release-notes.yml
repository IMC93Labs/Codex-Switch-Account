name: Bilingual Release Notes / Notas de Release bilingües

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-release:
    if: github.head_ref == 'bilingual-release-v1.7.2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main / Obtener main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Update v1.7.2 Release notes / Actualizar notas de la Release v1.7.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit v1.7.2 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex Account Switcher v1.7.2" \
            --notes-file RELEASE_NOTES.md
