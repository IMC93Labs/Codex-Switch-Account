name: Report a bug / Reportar un problema
description: Report unexpected behaviour in Codex Account Switcher / Informa de un error o comportamiento inesperado
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.
        Gracias por dedicar tiempo a informar de un problema.

        **Important / Importante:** do not include authentication tokens, cookies, passwords, session files, account backups, private conversations or other sensitive data.

        Codex Account Switcher is an independent hobby project and is not affiliated with or endorsed by OpenAI.

        Read / Lee: [Support / Soporte](https://github.com/IMC93Labs/Codex-Switch-Account/blob/main/SUPPORT.md)

  - type: input
    id: version
    attributes:
      label: Codex Account Switcher version / Versión de Codex Account Switcher
      placeholder: "e.g. / ej. v1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version / Versión de Windows
      placeholder: "e.g. / ej. Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: codex_version
    attributes:
      label: Codex Desktop version / Versión de Codex Desktop
      description: If known / Si la conoces
      placeholder: "Version or unknown / Versión o desconocida"

  - type: dropdown
    id: area
    attributes:
      label: Affected function / Función afectada
      options:
        - Account switch / Cambio de cuenta
        - Account or subscription status refresh / Actualización de estado de cuenta o suscripción
        - Opening or closing Codex / Apertura o cierre de Codex
        - Backup / Copia de seguridad
        - Restore or migration / Restauración o migración
        - System tray or Windows startup / Bandeja o arranque con Windows
        - User interface / Interfaz
        - Other / Otra
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened? / ¿Qué ha ocurrido?
      description: Describe the problem clearly without including account or session secrets. / Describe el problema claramente sin incluir secretos de cuenta o sesión.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pasos para reproducirlo
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour / Comportamiento esperado
      description: What should have happened? / ¿Qué debería haber ocurrido?
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility / Frecuencia
      options:
        - Always / Siempre
        - Often / A menudo
        - Sometimes / A veces
        - Happened once / Ha ocurrido una vez
        - Not sure / No estoy seguro
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information / Información adicional
      description: Add sanitized screenshots or logs only after removing names, emails, tokens, cookies, session data, private conversations and other sensitive information. / Añade capturas o registros revisados solo después de eliminar nombres, correos, tokens, cookies, datos de sesión, conversaciones privadas y otra información sensible.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks / Comprobaciones
      options:
        - label: I searched existing Issues for the same problem. / He buscado si ya existe un Issue sobre el mismo problema.
          required: true
        - label: I am using only accounts that belong to me or that I am authorized to use. / Utilizo únicamente cuentas que me pertenecen o que estoy autorizado a utilizar.
          required: true
        - label: I have not included authentication tokens, cookies, passwords, session files, account backups, private conversations or other sensitive data. / No he incluido tokens de autenticación, cookies, contraseñas, archivos de sesión, copias de cuentas, conversaciones privadas ni otros datos sensibles.
          required: true
        - label: This report is about Codex Account Switcher itself, not an OpenAI billing, quota, subscription or service issue. / Este reporte trata sobre Codex Account Switcher, no sobre un problema de facturación, cuota, suscripción o servicio de OpenAI.
          required: true
