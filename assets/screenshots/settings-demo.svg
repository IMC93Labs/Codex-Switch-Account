<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900"><rect width="1120" height="900" fill="#0d1117"/><rect x="10" y="10" width="1100" height="880" rx="22" fill="#0d1117" stroke="#303b4a"/><rect x="10" y="10" width="1100" height="68" rx="22" fill="#111720"/><text x="36" y="52" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="22" font-weight="700">Ajustes · Codex Account Switcher</text><text x="1060" y="52" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="30">×</text><rect x="42" y="102" width="68" height="68" rx="15" fill="#202937" stroke="#4a596d"/><circle cx="76" cy="136" r="22" fill="#3a4658"/><text x="130" y="133" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="34" font-weight="700">Ajustes</text><text x="130" y="165" fill="#a9bad2" font-family="Segoe UI,Arial" font-size="18">Inicio, copias y migración entre equipos</text><rect x="38" y="195" width="145" height="58" rx="13" fill="#151b23" stroke="#354154"/><rect x="200" y="195" width="270" height="58" rx="13" fill="#202938" stroke="#61728b"/><text x="78" y="232" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="20">General</text><text x="247" y="232" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="20">Copias y migración</text><rect x="38" y="275" width="1044" height="480" rx="22" fill="#151b23" stroke="#354154"/>
<g font-family="Segoe UI,Arial"><rect x="60" y="300" width="1000" height="130" rx="17" fill="#111720" stroke="#354154"/><text x="82" y="342" fill="#f0f6fc" font-size="21" font-weight="700">Cuentas A · B · C · D · E · F · G · H</text><text x="82" y="377" fill="#b2c2d8" font-size="17">Guarda los inicios de sesión en un archivo portátil cifrado.</text><text x="82" y="403" fill="#b2c2d8" font-size="17">Al restaurarlo en otro PC se protegen de nuevo con DPAPI.</text><rect x="650" y="335" width="170" height="54" rx="13" fill="#202938" stroke="#42506a"/><rect x="838" y="335" width="190" height="54" rx="13" fill="#202938" stroke="#42506a"/><text x="686" y="369" fill="#f0f6fc" font-size="19">Guardar cuentas</text><text x="872" y="369" fill="#f0f6fc" font-size="19">Restaurar cuentas</text>
<rect x="60" y="445" width="1000" height="130" rx="17" fill="#111720" stroke="#354154"/><text x="82" y="487" fill="#f0f6fc" font-size="21" font-weight="700">Historial local de Codex</text><text x="82" y="522" fill="#b2c2d8" font-size="17">Guarda sesiones, archived_sessions e índices JSON.</text><text x="82" y="548" fill="#b2c2d8" font-size="17">Al restaurar, los chats se combinan con los existentes.</text><rect x="650" y="480" width="170" height="54" rx="13" fill="#202938" stroke="#42506a"/><rect x="838" y="480" width="190" height="54" rx="13" fill="#202938" stroke="#42506a"/><text x="684" y="514" fill="#f0f6fc" font-size="19">Guardar historial</text><text x="866" y="514" fill="#f0f6fc" font-size="19">Restaurar historial</text>
<rect x="60" y="590" width="1000" height="130" rx="17" fill="#111720" stroke="#607089"/><text x="82" y="632" fill="#f0f6fc" font-size="21" font-weight="700">Migración completa</text><text x="82" y="667" fill="#b2c2d8" font-size="17">Un solo archivo cifrado con las ocho cuentas y el historial local.</text><text x="82" y="693" fill="#b2c2d8" font-size="17">Opción recomendada para cambiar de ordenador.</text><rect x="650" y="625" width="170" height="54" rx="13" fill="#202938" stroke="#42506a"/><rect x="838" y="625" width="190" height="54" rx="13" fill="#202938" stroke="#42506a"/><text x="692" y="659" fill="#f0f6fc" font-size="19">Exportar todo</text><text x="882" y="659" fill="#f0f6fc" font-size="19">Restaurar todo</text>
<text x="66" y="742" fill="#f4b942" font-size="16">Las copias se cifran con una contraseña elegida por ti. No pierdas esa contraseña.</text><text x="38" y="815" fill="#b2c2d8" font-size="17">Los cambios solo afectan al usuario actual de Windows.</text><rect x="735" y="785" width="145" height="58" rx="13" fill="#202938" stroke="#42506a"/><rect x="895" y="785" width="175" height="58" rx="13" fill="#202938" stroke="#42506a"/><text x="774" y="822" fill="#f0f6fc" font-size="20">Cancelar</text><text x="922" y="822" fill="#f0f6fc" font-size="20">Guardar ajustes</text><text x="890" y="880" fill="#65758a" font-size="12">Captura de demostración</text></g></svg>